---
- name: Install monit on Ubuntu
  ansible.builtin.include_tasks: ubuntu.yml
  when: ansible_distribution == 'Ubuntu'

- name: Install monit on RedHat
  ansible.builtin.include_tasks: redhat.yml
  when: ansible_facts['os_family'] == "RedHat"

- name: Load RedHat variables
  ansible.builtin.include_vars: redhat.yml
  when: ansible_facts["os_family"] == "RedHat"

- name: Load Ubuntu variables
  ansible.builtin.include_vars: ubuntu.yml
  when: ansible_facts["os_family"] == "Debian"

- name: Delete monit config files directory
  ansible.builtin.file:
    path: "{{ monit_includes }}"
    state: absent
  notify:
    - Restart monit

- name: Create monit config files directory
  ansible.builtin.file:
    path: "{{ monit_includes }}"
    state: directory
    mode: "0755"
    owner: root
    group: root
  notify:
    - Restart monit

- name: Copy monitrc configuration file
  ansible.builtin.template:
    src: "templates/etc/monit/monitrc.j2"
    dest: "{{ monit_configuration_path }}"
    mode: "0600"
  notify:
    - Restart monit

- name: Create the scripts directory
  ansible.builtin.file:
    path: "{{ monit_exec_script_dir }}"
    state: directory
    mode: "0755"
    owner: root
    group: root

- name: Copy scripts
  ansible.builtin.copy:
    dest: "{{ monit_exec_script_dir }}/{{ item.name }}"
    content: "{{ item.content }}"
    mode: "0755"
    owner: root
    group: root
  with_items: "{{ monit_exec_scripts }}"
  notify:
    - Restart monit

- name: Enable the Monit service
  ansible.builtin.service:
    name: monit
    state: started
    enabled: true
