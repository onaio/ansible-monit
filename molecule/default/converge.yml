---
- name: Converge
  hosts: all
  become: true
  vars:
    monit_setup_mode: true
    slack_monit_endpoint: "https://hooks.slack.invalid/services/test"
    monit_scripts:
      - monit
      - system
      - cron
      - openssh-server
      - rsyslog
  pre_tasks:
    - name: Update apt cache
      ansible.builtin.apt:
        update_cache: true
      changed_when: false
  tasks:
    - name: Run the role
      ansible.builtin.include_role:
        name: "{{ lookup('env', 'MOLECULE_PROJECT_DIRECTORY') }}"
